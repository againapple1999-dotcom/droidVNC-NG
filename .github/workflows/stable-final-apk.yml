name: Stable Signed APK (Manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source with native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Avoid intermittent corrupted Google NDK downloads causing ZipException.
      - name: Install Android NDK with clean retries
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "NDK installation attempt $attempt/3"
            if sdkmanager --install "ndk;28.2.13676358"; then
              echo "Android NDK installed"
              break
            fi
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358"
            if [ "$attempt" = 3 ]; then
              echo "::error::NDK download failed after 3 tries; check SDK CDN availability"
              exit 1
            fi
            sleep 10
          done

      # Android's default debug signing configuration reads ~/.android/debug.keystore.
      # Without this secret, ephemeral runners create a DIFFERENT key every build.
      - name: Restore stable signing key
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -eu
          if [ -z "$ANDROID_DEBUG_KEYSTORE_B64" ]; then
            echo '::error::Configure ANDROID_DEBUG_KEYSTORE_B64 in GitHub Actions secrets first.'
            exit 1
          fi
          mkdir -p "$HOME/.android"
          umask 077
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey > /dev/null

      - name: Build debug APK with stable certificate
        run: |
          chmod +x gradlew
          test -f app/google-services.json || { echo '::error::Missing app/google-services.json'; exit 1; }
          ./gradlew assembleDebug --no-daemon

      - name: Upload stable APK
        uses: actions/upload-artifact@v4
        with:
          name: Remote-Assistance-Stable-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
